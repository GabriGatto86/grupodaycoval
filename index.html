<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dayvertidamente | Termômetro de Emoções</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap');

  :root{
    --navy: #04173B;
    --navy2: #072a5e;
    --gold: #FFC738;
    --paper: #FDFAF3;

    --feliz-d: #C98A11;
    --triste-d: #2F6FC4;
    --nervoso-d: #C23B2B;
    --ansioso-d: #6E3FCB;
    --pensativo-d: #147F73;
    --tranquilo-d: #379452;
    --esperancoso-d: #DD8A0C;
    --euforico-d: #D6488F;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    background: radial-gradient(circle at 15% 10%, var(--navy2), var(--navy) 60%);
    font-family:'Nunito', sans-serif;
    color: var(--paper);
    position:relative;
    overflow-x:hidden;
    padding-bottom:60px;
  }

  .blob{
    position:fixed;
    border-radius:50%;
    filter: blur(50px);
    opacity:0.18;
    z-index:0;
    animation: drift 14s ease-in-out infinite;
  }
  .blob.b1{ width:340px; height:340px; background:#FFD34D; top:-80px; left:-80px; }
  .blob.b2{ width:280px; height:280px; background:#F28FC0; bottom:-60px; right:-60px; animation-delay:-4s;}
  .blob.b3{ width:220px; height:220px; background:#38C6B4; top:40%; left:70%; animation-delay:-8s;}
  @keyframes drift{
    0%,100%{ transform: translateY(0) translateX(0); }
    50%{ transform: translateY(-24px) translateX(18px); }
  }
  @media (prefers-reduced-motion: reduce){ .blob{ animation:none; } }

  .wrap{
    position:relative;
    z-index:1;
    max-width:1040px;
    margin:0 auto;
    padding: 34px 20px 10px;
  }

  header{ text-align:center; margin-bottom: 26px; }

  .logo-img{
    width:74px; height:74px;
    border-radius:50%;
    object-fit:cover;
    object-position: top center;
    display:block;
    margin:0 auto 10px;
    border: 3px solid var(--gold);
    box-shadow: 0 4px 0 rgba(0,0,0,0.25);
  }

  h1{
    font-family:'Fredoka', sans-serif;
    font-size: clamp(2.4rem, 6vw, 3.6rem);
    margin: 0;
    line-height:1;
    color: var(--gold);
    text-shadow: 0 3px 0 rgba(0,0,0,0.2);
  }
  h1 span{ color:#fff; }

  header p{
    font-size:1.05rem;
    color:#cfe0ff;
    margin: 10px 0 0;
    font-weight:600;
  }

  .progress-row{ max-width:480px; margin: 22px auto 0; text-align:center; }
  .progress-row small{ color:#a9c1ee; font-weight:700; letter-spacing:.02em; }
  .bar-track{
    width:100%; height:10px; border-radius:999px;
    background: rgba(255,255,255,0.12); margin-top:6px; overflow:hidden;
  }
  .bar-fill{
    height:100%; background: var(--gold); border-radius:999px;
    width:0%; transition: width .5s ease;
  }

  .conn-banner{
    max-width:560px;
    margin: 16px auto 0;
    background: #F27B5F;
    color: #3a0d05;
    font-weight:700;
    font-size:0.9rem;
    padding: 10px 16px;
    border-radius: 12px;
    text-align:center;
    line-height:1.4;
  }

  .grid{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap:16px;
    margin-top: 28px;
  }
  @media (max-width: 860px){ .grid{ grid-template-columns: repeat(2, 1fr); } }

  .card{
    position:relative;
    border-radius: 18px;
    overflow:hidden;
    cursor:pointer;
    border: 3px solid transparent;
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    box-shadow: 0 8px 0 rgba(0,0,0,0.28);
    -webkit-tap-highlight-color: transparent;
    background: #0a2050;
  }
  .card:hover{ transform: translateY(-4px); }
  .card:active{ transform: translateY(0px); }
  .card:focus-visible{ outline: 3px solid #fff; outline-offset:2px; }
  .card.voted{ border-color:#fff; }
  .card.locked{ cursor:default; }
  .card.locked:hover{ transform:none; }
  .card.leading{
    border-color: var(--gold);
    box-shadow: 0 0 0 3px var(--gold), 0 8px 0 rgba(0,0,0,0.28);
  }

  .card img{
    display:block;
    width:100%;
    height:auto;
    position:relative;
    z-index:1;
  }

  .fill-overlay{
    position:absolute;
    left:0; right:0; bottom:0;
    height:0%;
    background: linear-gradient(to top, rgba(4,23,59,0.72), rgba(4,23,59,0.08));
    border-top: 3px solid var(--gold);
    transition: height .6s ease;
    z-index:2;
    pointer-events:none;
  }

  .pct-badge{
    position:absolute;
    top:8px; left:50%;
    transform: translateX(-50%);
    background: rgba(4,23,59,0.85);
    color:#fff;
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size:1.3rem;
    padding: 3px 16px;
    border-radius: 999px;
    min-width: 46px;
    text-align:center;
    z-index:3;
    transition: transform .2s ease;
  }
  .card.leading .pct-badge{
    background: var(--gold);
    color: var(--navy);
    transform: translateX(-50%) scale(1.08);
  }

  .status{
    text-align:center;
    margin-top: 22px;
    font-weight:700;
    color:#cfe0ff;
    min-height: 24px;
  }

  .actions{ text-align:center; margin-top: 18px; }

  .btn{
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size: 1.05rem;
    border:none;
    border-radius: 999px;
    padding: 13px 30px;
    cursor:pointer;
    background: var(--gold);
    color: var(--navy);
    box-shadow: 0 5px 0 #c99400;
    transition: transform .1s ease, box-shadow .1s ease;
  }
  .btn:hover{ transform: translateY(-2px); }
  .btn:active{ transform: translateY(2px); box-shadow: 0 2px 0 #c99400; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; box-shadow:none; transform:none; }
  .btn:focus-visible{ outline:3px solid #fff; outline-offset:2px; }

  .btn.ghost{
    background: transparent;
    color: #cfe0ff;
    box-shadow:none;
    text-decoration: underline;
    font-family:'Nunito',sans-serif;
    font-weight:700;
    font-size:0.85rem;
    padding: 8px 10px;
  }

  footer{ text-align:center; margin-top: 34px; color:#7f9bd6; font-size:0.8rem; }

  .overlay{
    position:fixed; inset:0;
    background: rgba(4,10,26,0.82);
    display:flex; align-items:center; justify-content:center;
    padding:20px; z-index:10;
    opacity:0; pointer-events:none;
    transition: opacity .25s ease;
  }
  .overlay.show{ opacity:1; pointer-events:all; }

  .result-card{
    background: var(--paper);
    color: #0d1a3a;
    border-radius: 26px;
    max-width: 440px;
    width:100%;
    padding: 26px 26px 26px;
    text-align:center;
    position:relative;
    transform: scale(0.9) translateY(10px);
    transition: transform .3s ease;
    box-shadow: 0 20px 0 rgba(0,0,0,0.25);
  }
  .overlay.show .result-card{ transform: scale(1) translateY(0); }

  .result-card .close{
    position:absolute; top:14px; right:16px;
    background:none; border:none; font-size:1.4rem; cursor:pointer; color:#9aa3b5; line-height:1;
  }

  .result-img{
    width:130px; height:130px;
    border-radius:50%;
    object-fit:cover;
    object-position: top center;
    display:block;
    margin:0 auto 12px;
    border: 4px solid var(--gold);
  }

  .result-tag{
    display:inline-block;
    font-family:'Fredoka',sans-serif;
    font-weight:600;
    padding: 5px 16px;
    border-radius:999px;
    color:#fff;
    margin-bottom: 14px;
    font-size:0.95rem;
  }

  .result-phrase{
    font-family:'Fredoka', sans-serif;
    font-size:1.2rem;
    line-height:1.4;
    margin: 6px 0 20px;
  }

  .result-actions{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .btn.small{ padding:10px 18px; font-size:0.9rem; }
  .btn.outline{
    background:transparent; color: #0d1a3a; box-shadow:none; border: 2px solid #0d1a3a;
  }
  .btn.outline:hover{ transform:none; background: rgba(4,23,59,0.06); }

</style>
</head>

    euforico: [

      "Empolgação desse jeito merece virar conquista. Vamos transformar essa energia em entrega.",
      "Time eufórico faz o impossível parecer fácil. Sigam nessa pegada até o fim da semana.",
      "Essa vibe alta é rara e vale ouro. Usem ela a favor de cada meta dessa semana.",
      "Energia lá em cima assim é hora de agir. Bora aproveitar esse embalo todo.",
      "Essa empolgação merece um objetivo à altura. Vamos apontar ela pra onde importa essa semana.",
      "Time animado desse jeito resolve qualquer parada. Sigam com esse ritmo!",
      "Que essa euforia dure a semana inteira e contagie todo mundo ao redor.",
      "Energia assim não se explica, se aproveita. Bora fazer valer cada gota dela essa semana."
    ]
  };

  const connBanner = document.getElementById('conn-banner');
  function showBanner(msg){ connBanner.textContent = msg; connBanner.style.display = 'block'; }
  function hideBanner(){ connBanner.style.display = 'none'; }

  const CONFIGURED = FIREBASE_DB_URL && FIREBASE_DB_URL.indexOf('COLE_AQUI') !== 0;
  const DATA_URL = CONFIGURED ? (FIREBASE_DB_URL.replace(/\/$/, '') + '/dayvertidamente.json') : null;

  function emptyVotes(){ const v = {}; EMOTIONS.forEach(e => v[e.key] = 0); return v; }
  function defaultState(){ return { votes: emptyVotes(), resetVersion: 1 }; }

  // Lê o estado atual e o ETag (usado para gravar sem sobrescrever votos
  // que chegaram de outras pessoas entre a leitura e a escrita).
  async function fetchStateWithEtag(){
    const res = await fetch(DATA_URL, { headers: { 'X-Firebase-ETag': 'true' }, cache: 'no-store' });
    if(!res.ok) throw new Error('http ' + res.status);
    const etag = res.headers.get('ETag');
    const data = await res.json();
    return { state: data || defaultState(), etag };
  }

  async function readState(){
    const res = await fetch(DATA_URL, { cache: 'no-store' });
    if(!res.ok) throw new Error('http ' + res.status);
    const data = await res.json();
    return data || defaultState();
  }

  // Aplica "mutate" sobre o estado mais atual e só grava se ninguém mexeu
  // nos dados entre a leitura e a escrita. Se alguém mexeu, busca de novo
  // e tenta outra vez (até 6 tentativas, cobre com folga 25 pessoas votando juntas).
  async function writeWithRetry(mutate){
    let { state, etag } = await fetchStateWithEtag();
    for(let attempt = 0; attempt < 6; attempt++){
      const updated = JSON.parse(JSON.stringify(state));
      mutate(updated);
      const headers = etag ? { 'if-match': etag } : {};
      const res = await fetch(DATA_URL, { method: 'PUT', headers, body: JSON.stringify(updated) });
      if(res.status === 412){
        etag = res.headers.get('ETag');
        state = (await res.json()) || defaultState();
        continue;
      }
      if(!res.ok) throw new Error('http ' + res.status);
      return updated;
    }
    throw new Error('conflito persistente');
  }

  let votes = emptyVotes();
  let resetVersion = 1;
  let myVote = null;

  function getMyVote(){
    try{
      const raw = localStorage.getItem('dayvertidamente_vote');
      if(!raw) return null;
      const obj = JSON.parse(raw);
      if(obj.version !== resetVersion) return null;
      return obj.emotion;
    }catch(e){ return null; }
  }
  function setMyVote(emotion){
    try{ localStorage.setItem('dayvertidamente_vote', JSON.stringify({ version: resetVersion, emotion })); }
    catch(e){ /* localStorage indisponível, o voto ainda conta no Firebase */ }
  }
  function clearMyVote(){
    try{ localStorage.removeItem('dayvertidamente_vote'); }catch(e){}
  }

  const grid = document.getElementById('grid');
  const statusEl = document.getElementById('status');
  const progressLabel = document.getElementById('progress-label');
  const progressFill = document.getElementById('progress-fill');
  const revealBtn = document.getElementById('reveal-btn');
  const overlay = document.getElementById('overlay');
  const resultTag = document.getElementById('result-tag');
  const resultPhrase = document.getElementById('result-phrase');
  const resultImg = document.getElementById('result-img');
  const resetBtn = document.getElementById('reset-btn');

  function buildCard(emotion){
    const card = document.createElement('div');
    card.className = 'card';
    card.tabIndex = 0;
    card.setAttribute('role','button');
    card.setAttribute('aria-label', 'Votar em ' + emotion.label);
    card.dataset.key = emotion.key;

    card.innerHTML = `
      <span class="pct-badge" id="pct-${emotion.key}">0%</span>
      <div class="fill-overlay" id="fill-${emotion.key}"></div>
      <img src="${IMAGES[emotion.key]}" alt="${emotion.label}">
    `;

    card.addEventListener('click', () => vote(emotion.key));
    card.addEventListener('keydown', (ev) => {
      if(ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); vote(emotion.key); }
    });

    grid.appendChild(card);
  }

  EMOTIONS.forEach(buildCard);

  function render(){
    const total = Object.values(votes).reduce((a,b)=>a+b,0);
    let maxCount = 0;
    EMOTIONS.forEach(e => { if(votes[e.key] > maxCount) maxCount = votes[e.key]; });

    EMOTIONS.forEach(e => {
      const pct = total > 0 ? Math.round((votes[e.key]/total)*100) : 0;
      const badge = document.getElementById('pct-' + e.key);
      if(badge) badge.textContent = pct + '%';
      const fill = document.getElementById('fill-' + e.key);
      if(fill) fill.style.height = pct + '%';
    });

    const pctFill = Math.min(100, Math.round((total/TEAM_SIZE)*100));
    progressFill.style.width = pctFill + '%';
    progressLabel.textContent = `${total} de ${TEAM_SIZE} já responderam`;

    document.querySelectorAll('.card').forEach(card => {
      const key = card.dataset.key;
      card.classList.toggle('voted', myVote === key);
      card.classList.toggle('locked', !!myVote);
      card.classList.toggle('leading', total > 0 && maxCount > 0 && votes[key] === maxCount);
    });

    if(myVote){
      const label = EMOTIONS.find(e => e.key === myVote).label;
      statusEl.textContent = `Você votou em "${label}". Obrigado! Acompanhe a turma respondendo aqui em cima.`;
    } else {
      statusEl.textContent = '';
    }

    if(total >= TEAM_SIZE){
      revealBtn.disabled = false;
      revealBtn.textContent = 'Gerar frase da semana';
    } else {
      revealBtn.disabled = true;
      revealBtn.textContent = `Aguardando o time (${total}/${TEAM_SIZE})`;
    }
  }

  async function vote(key){
    if(myVote || !CONFIGURED) return;
    myVote = key;
    votes[key] = (votes[key] || 0) + 1;
    setMyVote(key);
    render();
    try{
      const updated = await writeWithRetry((state) => {
        state.votes[key] = (state.votes[key] || 0) + 1;
      });
      votes = updated.votes;
      resetVersion = updated.resetVersion;
      hideBanner();
    }catch(e){
      showBanner('Não consegui salvar seu voto agora. Confira sua internet e tente de novo.');
    }
    render();
  }

  async function refreshFromServer(){
    if(!CONFIGURED) return;
    try{
      const state = await readState();
      votes = state.votes;
      if(state.resetVersion !== resetVersion){
        resetVersion = state.resetVersion;
        myVote = getMyVote();
      }
      hideBanner();
      render();
    }catch(e){
      showBanner('Não consegui conectar ao Firebase agora. Tentando de novo em instantes.');
    }
  }

  function pickWinner(v){
    let max = -1, winners = [];
    EMOTIONS.forEach(e => {
      const c = v[e.key] || 0;
      if(c > max){ max = c; winners = [e.key]; }
      else if(c === max){ winners.push(e.key); }
    });
    if(max <= 0) return EMOTIONS[Math.floor(Math.random()*EMOTIONS.length)].key;
    return winners[Math.floor(Math.random()*winners.length)];
  }

  let currentWinnerKey = null;

  function showResult(winnerKey, phrase){
    currentWinnerKey = winnerKey;
    const emotion = EMOTIONS.find(e => e.key === winnerKey);
    resultTag.textContent = 'Emoção da semana: ' + emotion.label;
    resultTag.style.background = `var(${emotion.dark})`;
    resultPhrase.textContent = phrase;
    resultImg.src = IMAGES[winnerKey];
    resultImg.alt = emotion.label;
    overlay.classList.add('show');
  }

  // Sempre recalcula a emoção mais votada com os dados mais recentes vindos
  // do Firebase. Isso garante que a frase mostrada corresponda exatamente
  // à emoção que está na frente no momento em que o botão é clicado.
  async function generatePhrase(){
    await refreshFromServer();
    const winnerKey = pickWinner(votes);
    const list = PHRASES[winnerKey];
    const phrase = list[Math.floor(Math.random()*list.length)];
    showResult(winnerKey, phrase);
  }

  // Mantém a mesma emoção vencedora já revelada, só sorteia outra frase
  // dentro da lista dela (usado no botão "Outra frase" dentro do card de resultado).
  function anotherPhraseSameWinner(){
    if(!currentWinnerKey) return generatePhrase();
    const list = PHRASES[currentWinnerKey];
    const phrase = list[Math.floor(Math.random()*list.length)];
    showResult(currentWinnerKey, phrase);
  }

  revealBtn.addEventListener('click', () => generatePhrase());
  document.getElementById('another-phrase').addEventListener('click', anotherPhraseSameWinner);

  document.getElementById('force-reveal-btn').addEventListener('click', async () => {
    await refreshFromServer();
    const total = Object.values(votes).reduce((a,b)=>a+b,0);
    if(total >= TEAM_SIZE){ generatePhrase(); return; }
    const ok = confirm(`Só ${total} de ${TEAM_SIZE} pessoas do time responderam até agora. Tem certeza que quer gerar a frase da semana mesmo assim?`);
    if(ok) generatePhrase();
  });
  document.getElementById('close-overlay').addEventListener('click', () => overlay.classList.remove('show'));
  document.getElementById('close-overlay-2').addEventListener('click', () => overlay.classList.remove('show'));
  overlay.addEventListener('click', (ev) => { if(ev.target === overlay) overlay.classList.remove('show'); });

  resetBtn.addEventListener('click', async () => {
    if(!CONFIGURED){ showBanner('Configure a URL do Firebase antes de usar o app (veja o passo a passo enviado).'); return; }
    const ok = confirm('Reiniciar a contagem começa uma nova semana zerada para todo o time. Confirmar?');
    if(!ok) return;
    try{
      const updated = await writeWithRetry((state) => {
        state.votes = emptyVotes();
        state.resetVersion = (state.resetVersion || 1) + 1;
      });
      votes = updated.votes;
      resetVersion = updated.resetVersion;
      clearMyVote();
      myVote = null;
      render();
      overlay.classList.remove('show');
      hideBanner();
    }catch(e){
      showBanner('Não consegui reiniciar a contagem agora. Confira sua internet e tente de novo.');
    }
  });

  async function init(){
    if(!CONFIGURED){
      showBanner('Configuração pendente: adicione a URL do Firebase Realtime Database no arquivo (constante FIREBASE_DB_URL) para ativar a votação do time.');
      render();
      return;
    }
    await refreshFromServer();
    myVote = getMyVote();
    render();
    setInterval(refreshFromServer, 4000);
  }

  init();

})();
</script>
